
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메시지 테스트</title>
</head>
<body>
    <button onclick="showMessage()">클릭하기</button>

    <div id="result"></div>

    <script>
        function showMessage() {
            const result = document.getElementById('result');

            if (result) {
                result.textContent = '버튼이 클릭되었습니다!';
            }
        }
    </script>
</body>
</html>
